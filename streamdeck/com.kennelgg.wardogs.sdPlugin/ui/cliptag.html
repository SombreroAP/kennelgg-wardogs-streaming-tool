<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="sdpi-components.js"></script>
</head>
<body>
<sdpi-item label="Tag">
  <sdpi-select setting="tag" default="highlight">
    <option value="highlight">highlight</option>
    <option value="funny">funny</option>
    <option value="fail">fail</option>
  </sdpi-select>
</sdpi-item>
<sdpi-item label="">
  <div style="color:#9a9a9a;font-size:11px">Saves a clip with this tag; the highlights compilation and the Clips window sort by tags.</div>
</sdpi-item>
<sdpi-item label="Bridge port">
  <sdpi-textfield setting="port" global default="47820" placeholder="47820"></sdpi-textfield>
</sdpi-item>
</body>
</html>
