<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Kennel.gg session stats: a browser source (1200 x 110) the plugin adds on request. It connects to
     the plugin's local bridge like the Stream Deck does, and redraws on every state message.
     Query: port (the bridge port), hide=revives,earned (cells to leave out). -->
<style>
@font-face { font-family: "Saira Condensed"; src: url("SairaCondensed-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "IBM Plex Mono"; src: url("IBMPlexMono-SemiBold.ttf"); font-weight: 600; }
:root { --graphite: rgba(18, 21, 24, 0.86); --line: rgba(232, 229, 221, 0.16); --bone: #e8e5dd;
        --dim: #9a978f; --amber: #c99a3b; --olive: #8f9c5a; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Saira Condensed", "Segoe UI", sans-serif; color: var(--bone); }
#bar { position: absolute; left: 0; top: 0; display: flex; align-items: stretch; background: var(--graphite);
       border: 1px solid var(--line); border-left: 4px solid var(--amber); opacity: 0; transition: opacity .4s; }
#bar.on { opacity: 1; }
.tag { display: flex; align-items: center; gap: 10px; padding: 0 18px 0 14px; border-right: 1px solid var(--line); }
.tag img { height: 44px; }
.tag span { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: 2px; color: var(--amber);
            text-transform: uppercase; line-height: 1.25; }
.c { padding: 10px 20px 12px; border-right: 1px solid var(--line); min-width: 70px; text-align: left; }
.c:last-child { border-right: 0; }
.c b { display: block; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: .5px;
       transition: color .3s; }
.c small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 2px;
           color: var(--dim); text-transform: uppercase; margin-top: 6px; }
.c.up b { color: var(--amber); }
.c.money b { color: var(--olive); }
.c.money.up b { color: var(--amber); }
</style>
</head>
<body>
<div id="bar">
  <div class="tag"><img src="hound_mark.png" alt=""><span>This<br>session</span></div>
  <div class="c" id="kills"><b>0</b><small>Kills</small></div>
  <div class="c" id="deaths"><b>0</b><small>Deaths</small></div>
  <div class="c" id="kd"><b>0.0</b><small>K/D</small></div>
  <div class="c" id="assists"><b>0</b><small>Assists</small></div>
  <div class="c" id="revives"><b>0</b><small>Revives</small></div>
  <div class="c money" id="earned"><b>$0</b><small>Earned</small></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var port = q.get("port") || "47821";
  (q.get("hide") || "").split(",").forEach(function (id) {
    var el = document.getElementById(id.trim());
    if (el) el.style.display = "none";
  });
  var last = {};
  function set(id, text) {
    var el = document.getElementById(id);
    if (!el) return;
    var b = el.querySelector("b");
    if (b.textContent === text) return;
    b.textContent = text;
    if (last[id] !== undefined) {            // a change, not the first draw: flash it
      el.classList.add("up");
      setTimeout(function () { el.classList.remove("up"); }, 1600);
    }
    last[id] = text;
  }
  function draw(s) {
    set("kills", String(s.kills || 0));
    set("deaths", String(s.deaths || 0));
    set("kd", (s.kd || 0).toFixed(s.kd >= 10 ? 0 : 1));
    set("assists", String(s.assists || 0));
    set("revives", String(s.revives || 0));
    set("earned", s.earnedText || "$0");
    document.getElementById("bar").classList.add("on");
  }
  function connect() {
    var ws;
    try { ws = new WebSocket("ws://127.0.0.1:" + port); } catch (e) { setTimeout(connect, 3000); return; }
    ws.onopen = function () { ws.send(JSON.stringify({ type: "subscribe", frames: false })); };
    ws.onmessage = function (m) {
      if (typeof m.data !== "string") return;
      try {
        var o = JSON.parse(m.data);
        if (o.type === "state" && o.session) draw(o.session);
      } catch (e) {}
    };
    ws.onclose = function () { setTimeout(connect, 3000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connect();
})();
</script>
</body>
</html>
