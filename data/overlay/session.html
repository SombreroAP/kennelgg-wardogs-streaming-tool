<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Kennel.gg session stats: a full-canvas browser source the plugin adds on request. It connects to
     the plugin's local bridge like the Stream Deck does, and redraws on every state message. What it
     shows, in what order, where, whether it is on at all, and always or only when a number changes,
     all come from the plugin (Settings, Clips & replays) in state.session, so a change shows at once
     and every appearance, disappearance and move is animated.
     Query: port (the bridge port). -->
<style>
@font-face { font-family: "Chakra Petch"; src: url("ChakraPetch-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Chakra Petch"; src: url("ChakraPetch-SemiBold.ttf"); font-weight: 600; }
:root { --graphite: rgba(18, 21, 24, 0.86); --line: rgba(232, 229, 221, 0.16); --bone: #e8e5dd;
        --dim: #9a978f; --amber: #c99a3b; --olive: #8f9c5a; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Chakra Petch", "Segoe UI", sans-serif; font-weight: 700; color: var(--bone); }
/* where it sits (1080p units, scaled to the canvas by #wrap's transform) */
#wrap { position: absolute; transform-origin: 0 0; }
#wrap.tl { left: 40px; top: 100px; }
#wrap.bc { left: 50%; bottom: 56px; }
#bar { position: relative; display: flex; align-items: stretch; background: var(--graphite);
       border: 1px solid var(--line); border-left: 4px solid var(--amber); }
/* in: the amber edge first, the panel wipes open, the cells rise in one after another.
   out: the cells drop away, then the panel wipes shut. Top left wipes from its left edge, bottom
   centre from its middle. */
#bar { clip-path: inset(0 100% 0 0); transition: clip-path .42s cubic-bezier(.7, 0, .84, 0) .16s; }
.bc #bar { clip-path: inset(0 50% 0 50%); }
/* open, the clip reaches past the bar so the change tags below (above, at the bottom) are not cut off */
#wrap.shown #bar { clip-path: inset(-90px -60px -90px -60px); transition: clip-path .62s cubic-bezier(.16, 1, .3, 1) 0s; }
#edge { position: absolute; left: -4px; top: -1px; bottom: -1px; width: 4px; background: var(--amber);
        transform: scaleY(0); transition: transform .25s ease-in .45s; }
.bc #edge { display: none; }
#wrap.shown #edge { transform: scaleY(1); transition: transform .28s cubic-bezier(.16, 1, .3, 1) 0s; }
.c, .tag { opacity: 0; transform: translateY(14px); transition: opacity .18s ease-in, transform .22s ease-in;
           transition-delay: calc(var(--i, 0) * 30ms); }
#wrap.shown .c, #wrap.shown .tag { opacity: 1; transform: none;
           transition: opacity .35s ease-out, transform .55s cubic-bezier(.16, 1, .3, 1);
           transition-delay: calc(160ms + var(--i, 0) * 70ms); }
.tag { display: flex; align-items: center; gap: 10px; padding: 0 18px 0 14px; border-right: 1px solid var(--line); }
.tag img { height: 44px; }
.tag span { font-family: "Chakra Petch", "Segoe UI", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px; color: var(--amber);
            text-transform: uppercase; line-height: 1.25; }
.c { padding: 10px 20px 12px; border-right: 1px solid var(--line); min-width: 70px; text-align: left; }
.c:last-child { border-right: 0; }
.c b { display: block; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: .5px; white-space: nowrap;
       transition: color .3s; font-variant-numeric: tabular-nums; }
.c small { display: block; white-space: nowrap; font-family: "Chakra Petch", "Segoe UI", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 2px;
           color: var(--dim); text-transform: uppercase; margin-top: 6px; }
.c.up b { color: var(--amber); }
.c.money b { color: var(--olive); }
.c.money.up b { color: var(--amber); }
.c.spent b { color: #ce6050; }
.c { position: relative; }
/* what just changed ("+1 K", "+$1,000"): a tag that drops out just under the cell, then fades */
.c i { position: absolute; left: 16px; top: 100%; margin-top: 6px; font-style: normal; font-weight: 700; font-size: 20px;
       line-height: 1; padding: 6px 10px 5px; background: var(--graphite); border-left: 3px solid var(--amber);
       color: var(--amber); white-space: nowrap; opacity: 0; transform: translateY(-8px); pointer-events: none; }
.c i:empty { display: none; }
.c i.go { animation: drop 2.8s ease-out forwards; }
.c.spent i { color: #e07a6a; border-left-color: #ce6050; }
.c.money i { color: #a9b86e; border-left-color: #8f9c5a; }
@keyframes drop { 0% { opacity: 0; transform: translateY(-10px); } 10% { opacity: 1; transform: translateY(0); }
                  75% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(4px); } }
.c.spent.up b { color: var(--amber); }
/* the session balance: green while the session is up, red while it is down, bone at nothing */
.c.net b { color: var(--bone); }
.c.net.gain b { color: #5fd07a; }
.c.net.loss b { color: #ef5a4c; }
.c.net.up b { text-shadow: 0 0 14px currentColor; }
.c.net i { color: #7fe093; border-left-color: #5fd07a; }
.c.net i.neg { color: #f27a6e; border-left-color: #ef5a4c; }
/* what the last change was for (KILL, ASSIST, PURCHASE), right beside the number: it slides open,
   stays a moment, and folds away again */
.c .row { display: flex; align-items: center; }
.c .why { display: block; max-width: 0; margin-left: 0; overflow: hidden; white-space: nowrap; opacity: 0;
          font-family: "Chakra Petch", "Segoe UI", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px;
          line-height: 1.1; color: #7fe093; transform: translateX(-6px);
          transition: max-width .5s cubic-bezier(.16, 1, .3, 1), margin-left .5s cubic-bezier(.16, 1, .3, 1),
                      opacity .3s ease-out, transform .5s cubic-bezier(.16, 1, .3, 1); }
.c .why.neg { color: #f27a6e; }
.c .why.on { max-width: 320px; margin-left: 14px; opacity: 1; transform: none; }
/* at the bottom the increases rise above the bar instead */
.bc .c i { top: auto; bottom: 100%; margin: 0 0 6px 0; }
</style>
</head>
<body>
<div id="wrap" class="tl"><div id="bar">
  <div id="edge"></div>
  <div class="tag"><img src="hound_mark.png" alt=""><span>This<br>session</span></div>
</div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var port = q.get("port") || "47821";
  // what each cell shows: its label, its class, and its value from the plugin's session object
  var CELLS = {
    kda:       ["K / D / A", "",      function (s) { return s.kdaText || "0 / 0 / 0"; }],
    kills:     ["Kills", "",          function (s) { return String(s.kills || 0); }],
    deaths:    ["Deaths", "",         function (s) { return String(s.deaths || 0); }],
    assists:   ["Assists", "",        function (s) { return String(s.assists || 0); }],
    kd:        ["K/D", "",            function (s) { return (s.kd || 0).toFixed(s.kd >= 10 ? 0 : 1); }],
    downs:     ["Downs", "",          function (s) { return String(s.downs || 0); }],
    revives:   ["Revives", "",        function (s) { return String(s.revives || 0); }],
    headshots: ["Headshots", "",      function (s) { return String(s.headshots || 0); }],
    vehicles:  ["Vehicles", "",       function (s) { return String(s.vehicles || 0); }],
    net:       ["Session balance", "net", function (s) { return signed(s.net || 0); }],
    earned:    ["Earned", "money",    function (s) { return s.earnedText || "$0"; }],
    spent:     ["Spent", "spent",     function (s) { return s.spentText || "$0"; }],
    permin:    ["$ / min", "money",   function (s) { return s.perMinText || "-"; }],
    balance:   ["Balance", "money",   function (s) { return s.balanceChangeText || "-"; }],
    longest:   ["Longest", "",        function (s) { return s.longest ? s.longest + " m" : "-"; }]
  };
  var bar = document.getElementById("bar"), shown = "";
  function build(ids) {
    Array.prototype.slice.call(bar.querySelectorAll(".c")).forEach(function (n) { n.remove(); });
    ids.forEach(function (id) {
      var def = CELLS[id];
      if (!def) return;
      var c = document.createElement("div");
      c.className = "c " + def[1];
      c.id = "c-" + id;
      c.style.setProperty("--i", String(bar.querySelectorAll(".c").length + 1));
      c.innerHTML = id === "net" ? "<div class=\"row\"><b></b><span class=\"why\"></span></div><small></small><i></i>"
                                 : "<b></b><small></small><i></i>";
      c.querySelector("small").textContent = def[0];
      bar.appendChild(c);
    });
  }
  function money(n) { return (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US"); }
  function signed(n) { n = Math.round(n); return (n > 0 ? "+" : "") + money(n); }
  function tint(id, v) {                        // the session balance's colour follows its sign
    var el = document.getElementById("c-" + id);
    if (!el || id !== "net") return;
    el.classList.toggle("gain", Math.round(v) > 0);
    el.classList.toggle("loss", Math.round(v) < 0);
  }
  // money counts up to its new figure instead of jumping (the numbers go up in front of viewers)
  var rolling = {};
  function roll(id, from, to) {
    var el = document.getElementById("c-" + id);
    if (!el) return;
    var b = el.querySelector("b"), t0 = performance.now(), dur = 900;
    rolling[id] = t0;
    (function step(now) {
      if (rolling[id] !== t0) return;           // a newer change took over
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      var v = from + (to - from) * e;
      b.textContent = id === "net" ? signed(v) : money(v);
      tint(id, v);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  function badge(id, text) {
    var el = document.getElementById("c-" + id);
    if (!el || !text) return;
    var i = el.querySelector("i");
    i.textContent = text;
    i.classList.toggle("neg", text.charAt(0) === "-");
    i.classList.remove("go");
    void i.offsetWidth;                         // restart the animation
    i.classList.add("go");
  }
  var whyT = 0;
  function why(el, list) {
    var w = el.querySelector(".why");
    if (!w) return;
    var sum = list.reduce(function (a, m) { return a + m.amt; }, 0);
    var words = [];
    list.forEach(function (m) { if (words.indexOf(m.why) < 0) words.push(m.why); });
    w.textContent = words.join(" + ");
    w.classList.toggle("neg", sum < 0);
    w.classList.remove("on");
    void w.offsetWidth;
    w.classList.add("on");
    clearTimeout(whyT);
    whyT = setTimeout(function () { w.classList.remove("on"); }, 3200);
  }
  var prev = null;
  function deltas(s) {
    var out = {};
    if (!prev) return out;
    var n = function (k) { return (s[k] || 0) - (prev[k] || 0); };
    var parts = [];
    if (n("kills") > 0) parts.push("+" + n("kills") + " K");
    if (n("deaths") > 0) parts.push("+" + n("deaths") + " D");
    if (n("assists") > 0) parts.push("+" + n("assists") + " A");
    out.kda = parts.join("  ");
    ["kills", "deaths", "assists", "revives", "downs", "headshots", "vehicles"].forEach(function (k) {
      if (n(k) > 0) out[k] = "+" + n(k);
    });
    if (n("earned") > 0) out.earned = "+" + money(n("earned"));
    if (n("spent") > 0) out.spent = "+" + money(n("spent"));
    if (n("net") !== 0) out.net = signed(n("net"));
    // what each new change was for, from the plugin's log of them
    var seen = prev.moneyLog && prev.moneyLog.length ? prev.moneyLog[prev.moneyLog.length - 1].seq : 0;
    var fresh = (s.moneyLog || []).filter(function (m) { return m.seq > seen; });
    if (fresh.length) {
      out.net = fresh.map(function (m) { return signed(m.amt); }).join("  ");
      out.why = fresh;
    }
    return out;
  }
  function draw(s) {
    var ids = (s.show && s.show.length ? s.show : ["kda", "revives", "net", "permin"]);
    if (ids.join(",") !== shown) { shown = ids.join(","); build(ids); }
    var d = deltas(s);
    ids.forEach(function (id) {
      var el = document.getElementById("c-" + id);
      if (!el) return;
      var text = CELLS[id][2](s), b = el.querySelector("b");
      if ((id === "earned" || id === "spent") && prev && (s[id] || 0) > (prev[id] || 0)) {
        roll(id, prev[id] || 0, s[id] || 0);
      } else if (id === "net" && prev && (s.net || 0) !== (prev.net || 0)) {
        roll(id, prev.net || 0, s.net || 0);        // counts up or down to it, the colour following
      } else if (b.textContent !== text && !rolling[id]) {
        b.textContent = text;
      } else if (b.textContent !== text && rolling[id] && performance.now() - rolling[id] > 1000) {
        b.textContent = text;
      }
      if (!rolling[id] || performance.now() - rolling[id] > 1000) tint(id, s.net || 0);
      if (id === "net" && d.why) why(el, d.why);
      if (d[id]) {
        badge(id, d[id]);
        el.classList.add("up");
        setTimeout(function () { el.classList.remove("up"); }, 1600);
      }
    });
    var changed = Object.keys(d).length > 0;
    prev = s;
    place(s.overlay || {}, changed);
  }

  // ---- on or off, where, and always or only when something changes; every change animated
  var wrap = document.getElementById("wrap"), cur = { on: false, pos: "", shown: false }, popUntil = 0, popTimer = 0,
      replaying = false;
  function scale() {
    var k = window.innerHeight / 1080;
    wrap.style.transform = (wrap.classList.contains("bc") ? "translateX(-50%) " : "") + "scale(" + k + ")";
    wrap.style.transformOrigin = wrap.classList.contains("bc") ? "50% 100%" : "0 0";
  }
  window.addEventListener("resize", scale);
  function setShown(v) {
    if (cur.shown === v) return;
    cur.shown = v;
    wrap.classList.toggle("shown", v);
  }
  function place(o, changed) {
    var on = o.on !== false && bar.querySelectorAll(".c").length > 0;
    var pos = o.pos === "bc" ? "bc" : "tl", pop = o.mode === "pop";
    var now = Date.now();
    if (changed || !cur.on) popUntil = now + 20000;          // it just changed, or it just came on
    cur.on = on;
    var want = on && !replaying && (!pop || now < popUntil);
    if (pos !== cur.pos) {
      if (cur.pos && cur.shown) {                           // a move: out where it was, in where it goes
        setShown(false);
        setTimeout(function () { wrap.className = pos; scale(); cur.pos = pos; place(o, false); }, 700);
        return;
      }
      wrap.className = pos; scale(); cur.pos = pos;
      void wrap.offsetWidth;
    }
    setShown(want);
    clearTimeout(popTimer);
    if (pop && want) popTimer = setTimeout(function () { place(o, false); }, popUntil - now + 50);
  }
  function connect() {
    var ws;
    try { ws = new WebSocket("ws://127.0.0.1:" + port); } catch (e) { setTimeout(connect, 3000); return; }
    ws.onopen = function () { ws.send(JSON.stringify({ type: "subscribe", frames: false })); };
    ws.onmessage = function (m) {
      if (typeof m.data !== "string") return;
      try {
        var o = JSON.parse(m.data);
        if (o.type === "state" && o.session) {
          replaying = !!o.replayPlaying;     // an instant replay is past footage: the bar steps aside for it
          draw(o.session);
        }
      } catch (e) {}
    };
    ws.onclose = function () { setTimeout(connect, 3000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connect();
  window.__draw = draw; // for previewing the page by hand
  scale();
})();
</script>
</body>
</html>
