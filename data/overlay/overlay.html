<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Saira Condensed"; src: url("SairaCondensed-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "IBM Plex Mono"; src: url("IBMPlexMono-SemiBold.ttf"); font-weight: 600; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Saira Condensed", "Segoe UI", sans-serif; color: #fff; }
#grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; pointer-events: none; opacity: 0; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); display: none; }
#cam { display: none; }
.corner { position: absolute; width: 4vw; height: 4vw; border: 0.3vw solid #fff; opacity: .92; filter: drop-shadow(0 0 6px rgba(0,0,0,.7)); }
.tl { top: 3vw; left: 3vw; border-right: 0; border-bottom: 0; }
.tr { top: 3vw; right: 3vw; border-left: 0; border-bottom: 0; }
.bl { bottom: 3vw; left: 3vw; border-right: 0; border-top: 0; }
.br { bottom: 3vw; right: 3vw; border-left: 0; border-top: 0; }
.hud { position: absolute; font-size: 2.2vw; letter-spacing: 0.15vw; text-shadow: 0 2px 8px rgba(0,0,0,.8); font-family: "IBM Plex Mono", Consolas, monospace; font-weight: 600; }
#rec { top: 3.4vw; left: 8.5vw; }
#rec i { display: inline-block; width: 1.3vw; height: 1.3vw; border-radius: 50%; background: #e0352b; margin-right: 0.7vw; vertical-align: -0.1vw; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#clock { top: 3.4vw; right: 8.5vw; font-variant-numeric: tabular-nums; }
#bat { bottom: 3.6vw; right: 8.5vw; }
#bat span { display: inline-block; width: 2.6vw; height: 1.3vw; border: 0.16vw solid #fff; border-radius: 0.2vw; vertical-align: -0.2vw; position: relative; margin-left: 0.5vw; }
#bat span::before { content: ""; position: absolute; left: 0.15vw; top: 0.15vw; bottom: 0.15vw; width: 62%; background: #fff; }
#bat span::after { content: ""; position: absolute; right: -0.4vw; top: 0.3vw; width: 0.25vw; height: 0.6vw; background: #fff; }
#name { position: absolute; bottom: 3.2vw; left: 8.5vw; transform: none; font-size: 3.4vw; text-transform: uppercase; letter-spacing: 0.25vw; text-shadow: 0 3px 10px rgba(0,0,0,.85); display: none; line-height: 1; }
#name small { font-size: 1.8vw; color: #E8E5DD; opacity: .85; margin-right: 0.8vw; letter-spacing: 0.15vw; }
#name b { color: #C99A3B; }
#name.pos-tl { top: 3.2vw; bottom: auto; left: 8.5vw; right: auto; }
#name.pos-tc { top: 3.2vw; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); text-align: center; }
/* middle-left sits above the kill feed, which the game draws from about 40% down the left edge */
#name.pos-ml { top: 30%; bottom: auto; left: 8.5vw; right: auto; transform: translateY(-50%); }
#name.pos-mc { top: 50%; bottom: auto; left: 50%; right: auto; transform: translate(-50%, -50%); text-align: center; }
#name.pos-bl { top: auto; bottom: 3.2vw; left: 8.5vw; right: auto; }
#name.pos-br { top: auto; bottom: 3.2vw; left: auto; right: 8.5vw; text-align: right; }
/* portrait (v=1): everything sized on the width of a 9:16 canvas, tag across the top where the
   vertical crop of a 16:9 feed leaves room and no game HUD sits */
body.v .corner { width: 8vw; height: 8vw; border-width: 0.6vw; }
body.v .tl { top: 4vw; left: 4vw; } body.v .tr { top: 4vw; right: 4vw; }
body.v .bl { bottom: 4vw; left: 4vw; } body.v .br { bottom: 4vw; right: 4vw; }
body.v .hud { font-size: 3.6vw; letter-spacing: 0.25vw; }
body.v #rec { top: 5vw; left: 14vw; } body.v #clock { top: 5vw; right: 14vw; } body.v #bat { bottom: 5.4vw; right: 14vw; }
body.v #rec i { width: 2.2vw; height: 2.2vw; }
body.v #bat span { width: 4.4vw; height: 2.2vw; border-width: 0.3vw; }
body.v #name { font-size: 6vw; letter-spacing: 0.4vw; }
body.v #name small { font-size: 3.2vw; margin-right: 1.4vw; }
body.v #name.plate { padding: 1.4vw 2.4vw; border-left-width: 0.6vw; }
body.v #name.pos-tl, body.v #name.pos-tc { top: var(--vtop, 12vw); }
body.v #name.pos-ml { top: 34%; } body.v #name.pos-mc { top: 50%; }
body.v #name.pos-bl, body.v #name.pos-br { bottom: 12vw; }
#name.plate { background: rgba(11,14,16,.78); padding: 0.8vw 1.4vw; border-left: 0.35vw solid #C99A3B; }
/* small: inside the dual-POV window. The page is drawn at full canvas size and the whole window is
   then scaled to about a quarter, so the name has to be drawn LARGE here to read at all. --s is the
   size knob from the Dual POV tab (1 = the default). */
:root { --s: 1; }
body.s .corner { width: 5vw; height: 5vw; border-width: 0.4vw; top: 2.5vw; left: 2.5vw; }
body.s .corner.tr { left: auto; right: 2.5vw; }
body.s .corner.bl { top: auto; bottom: 2.5vw; }
body.s .corner.br { top: auto; bottom: 2.5vw; left: auto; right: 2.5vw; }
body.s .hud { font-size: 3vw; letter-spacing: 0.2vw; }
body.s #name { font-size: calc(8.5vw * var(--s)); letter-spacing: calc(0.4vw * var(--s)); }
body.s #name small { font-size: calc(4vw * var(--s)); margin-right: calc(1.2vw * var(--s)); }
body.s #name.plate { padding: calc(1.2vw * var(--s)) calc(2vw * var(--s)); border-left-width: calc(0.7vw * var(--s)); }
body.s #name.pos-tl, body.s #name.pos-tc { top: 3vw; }
body.s #name.pos-bl, body.s #name.pos-br { bottom: 3vw; }
body.s #name.pos-tl, body.s #name.pos-ml, body.s #name.pos-bl { left: 3vw; }
body.s #name.pos-br { right: 3vw; }
/* frame: a thin edge round the whole picture, so the small window reads as a window */
#frame { display: none; position: absolute; inset: 0.8vw; border: 0.4vw solid rgba(255,255,255,.85); box-shadow: 0 0 0 0.2vw rgba(0,0,0,.55), inset 0 0 0 0.2vw rgba(0,0,0,.55); pointer-events: none; }
body.s #frame { display: block; }
/* replay: the page is sized to the replay window itself, so vw is the window's width. A thicker
   edge than the dual window, and a tag in the top-left corner that says what this is. */
body.r #frame { display: block; inset: 0.6vw; border-width: 0.5vw; border-color: rgba(236,231,219,.92); }
#rtag { display: none; position: absolute; top: 2.4vw; left: 2.4vw; align-items: center; gap: 0.9vw;
  background: rgba(11,14,16,.82); border-left: 0.5vw solid #C99A3B; padding: 0.9vw 1.6vw 0.9vw 1.3vw;
  font-family: "Saira Condensed", "Segoe UI", sans-serif; font-weight: 700; font-size: 3.2vw; letter-spacing: 0.3vw;
  text-transform: uppercase; color: #ece7db; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
#rtag i { display: inline-block; width: 1.4vw; height: 1.4vw; border-radius: 50%; background: #e0352b; animation: blink 1s steps(1) infinite; }
body.r #rtag { display: flex; }
body.r #mark { display: none !important; }
/* the Kennel.gg mark: small, bottom-right, faint. Off the camcorder battery when that is on. */
#mark { display: none; position: absolute; right: 3vw; bottom: 3vw; align-items: center; gap: 0.6vw; opacity: .55; filter: drop-shadow(0 1px 4px rgba(0,0,0,.7)); pointer-events: none; }
#mark img { height: 2.4vw; width: auto; }
#mark span { font-family: "Saira Condensed", "Segoe UI", sans-serif; font-weight: 700; font-size: 1.6vw; letter-spacing: 0.12vw; color: #ece7db; line-height: 1; }
#mark span b { color: #C99A3B; font-weight: 700; }
body.cam #mark { right: 8.5vw; bottom: 6.6vw; }
body.v #mark { right: 4vw; bottom: 12vw; }
body.v #mark img { height: 4.4vw; } body.v #mark span { font-size: 3vw; }
body.s #mark { display: none !important; }
/* entrances: each time the source comes on screen (OBS tells the page, obsSourceVisibleChanged) the
   pieces come in one after another - corners close in from outside, the frame settles, the name
   plate and the replay tag wipe open from their left edge, the HUD fades up. body.in = arrived. */
.corner { transition: transform .5s cubic-bezier(.16, 1, .3, 1), opacity .3s ease-out; }
body:not(.in) .corner { opacity: 0; }
body:not(.in) .corner.tl { transform: translate(-2.5vw, -2.5vw); }
body:not(.in) .corner.tr { transform: translate(2.5vw, -2.5vw); }
body:not(.in) .corner.bl { transform: translate(-2.5vw, 2.5vw); }
body:not(.in) .corner.br { transform: translate(2.5vw, 2.5vw); }
.hud, #mark { transition: opacity .45s ease-out .25s; }
body:not(.in) .hud, body:not(.in) #mark { opacity: 0 !important; transition: none; }
#frame { transition: opacity .35s ease-out, transform .6s cubic-bezier(.16, 1, .3, 1); }
body:not(.in) #frame { opacity: 0; transform: scale(1.035); transition: none; }
#name, #rtag { clip-path: inset(-40% -8% -40% -2%); transition: clip-path .55s cubic-bezier(.16, 1, .3, 1) .12s, opacity .2s ease-out .12s; }
body:not(.in) #name, body:not(.in) #rtag { clip-path: inset(-40% 100% -40% -2%); opacity: 0; transition: none; }
#name.pos-tc, #name.pos-mc { transition-property: clip-path, opacity; }
body:not(.in) #name.pos-tc, body:not(.in) #name.pos-mc { clip-path: inset(-40% 50% -40% 50%); }
#name b, #rtag span { display: inline-block; transition: letter-spacing .7s cubic-bezier(.16, 1, .3, 1) .12s; }
body:not(.in) #name b, body:not(.in) #rtag span { letter-spacing: .6vw; transition: none; }
</style></head>
<body>
<canvas id="grain"></canvas>
<div id="vig"></div>
<div id="cam">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="hud" id="rec"><i></i>REC</div>
  <div class="hud" id="clock">00:00:00</div>
  <div class="hud" id="bat">BATT<span></span></div>
</div>
<div id="name"><small>POV</small><b>FRIEND</b></div>
<div id="frame"></div>
<div id="rtag"><i></i><span>Instant replay</span></div>
<div id="mark"><img src="hound_mark.png" alt=""><span>kennel<b>.gg</b></span></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var name = q.get("name") || "";
  var cam = q.get("cam") === "1", vig = q.get("vig") === "1", plate = q.get("plate") === "1";
  var small = q.get("small") === "1";
  if (small) document.body.classList.add("s");
  var scale = parseInt(q.get("scale") || "100", 10);
  if (scale > 0 && scale !== 100) document.documentElement.style.setProperty("--s", String(scale / 100));
  if (q.get("replay") === "1") {
    document.body.classList.add("r");
    var rt = q.get("rlabel"); if (rt) document.querySelector("#rtag span").textContent = rt;
  } else if (q.get("frame") !== "1") document.getElementById("frame").style.display = "none";
  var grain = Math.max(0, Math.min(100, parseInt(q.get("grain") || "0", 10) || 0));
  var label = q.get("label") || "POV";
  var portrait = q.get("v") === "1";
  if (portrait) document.body.classList.add("v");
  var vtop = parseInt(q.get("vtop") || "0", 10);
  if (portrait && vtop > 0) document.documentElement.style.setProperty("--vtop", vtop + "vh");

  if (name) { var n = document.getElementById("name"); n.style.display = "block"; n.querySelector("small").textContent = label; n.querySelector("b").textContent = name; if (plate) n.classList.add("plate"); n.classList.add("pos-" + (small ? "bl" : (q.get("pos") || (portrait ? "tc" : "ml")))); }
  if (vig) document.getElementById("vig").style.display = "block";
  if (q.get("mark") === "1") document.getElementById("mark").style.display = "flex";
  if (cam) document.body.classList.add("cam");
  if (cam) {
    document.getElementById("cam").style.display = "block";
    var t0 = Date.now(), clock = document.getElementById("clock");
    setInterval(function () {
      var s = Math.floor((Date.now() - t0) / 1000);
      var h = String(Math.floor(s / 3600)).padStart(2, "0"), m = String(Math.floor(s % 3600 / 60)).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
      clock.textContent = h + ":" + m + ":" + ss;
    }, 500);
  }
  // the entrance, on load and every time the source is shown again (enter=<ms> waits that long first:
  // under a stinger, the pieces arrive as it uncovers the screen)
  var enterMs = parseInt(q.getAll("enter").pop() || "180", 10) || 0, enterT = 0;   // the last one given wins
  function enter() {
    document.body.classList.remove("in");
    void document.body.offsetWidth;
    clearTimeout(enterT);
    enterT = setTimeout(function () { document.body.classList.add("in"); }, enterMs);
  }
  window.addEventListener("obsSourceVisibleChanged", function (e) {
    if (e.detail && e.detail.visible) enter(); else { clearTimeout(enterT); document.body.classList.remove("in"); }
  });
  if (q.has("still")) document.body.classList.add("in"); else enter();
  if (grain > 0) {
    var c = document.getElementById("grain"), ctx = c.getContext("2d");
    c.style.opacity = (grain / 100 * 0.45).toFixed(2);
    var W = 480, H = 270; c.width = W; c.height = H;
    var img = ctx.createImageData(W, H), d = img.data, last = 0;
    function frame(t) {
      if (t - last > 1000 / 15) {
        last = t;
        for (var i = 0; i < d.length; i += 4) { var v = 96 + (Math.random() * 128) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
        ctx.putImageData(img, 0, 0);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body></html>
